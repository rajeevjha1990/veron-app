<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>
      <ion-icon name="help-circle-outline" slot="start" style="margin-right: 6px;"></ion-icon>
      Support
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <ion-segment value="new" [(ngModel)]="activeTab" class="ion-padding">
    <ion-segment-button value="new">
      <ion-label>New Support</ion-label>
    </ion-segment-button>
    <ion-segment-button value="history">
      <ion-label>Support History</ion-label>
    </ion-segment-button>
  </ion-segment>

  <!-- New Support Form -->
  <div *ngIf="activeTab === 'new'" class="ion-padding">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Compose New Support Request
        </ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-item>
          <ion-input labelPlacement="floating" label="Subject" [(ngModel)]="support.subject" name="subject"></ion-input>
        </ion-item>

        <ion-item>
          <ion-textarea labelPlacement="floating" label="Query" [(ngModel)]="support.query" name="query"></ion-textarea>
        </ion-item>

        <ion-button (click)="submitSupport()" expand="block" type="submit" color="primary" class="ion-margin-top">
          <ion-icon slot="start" name="send-outline"></ion-icon>
          Submit
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>

  <!-- Support History -->
  <!-- Support History -->
  <div *ngIf="activeTab === 'history'" class="ion-padding">
    <ion-card *ngFor="let ticket of supportHistory">
      <ion-card-header>
        <ion-card-title>{{ ticket.subject }}</ion-card-title>
        <ion-card-subtitle>Ticket #{{ ticket.tkt_no }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item *ngFor="let msg of ticket.conversation">
            <ion-icon [name]="msg.reply_by_ref === 'user' ? 'person-circle-outline' : 'headset-outline'" slot="start">
            </ion-icon>
            <ion-label>
              <h3>{{ msg.reply_by_ref === 'user' ? 'You' : 'Support' }}</h3>
              <p>{{ msg.reply_msg }}</p>
              <small>{{ msg.res_date | date:'short' }}</small>
            </ion-label>
          </ion-item>
        </ion-list>

        <!-- Reply Section -->
        <ion-item>
          <ion-textarea placeholder="Type your reply..." [(ngModel)]="ticket.replyText"></ion-textarea>
          <ion-button (click)="sendReply(ticket)" fill="solid" color="primary" slot="end">
            <ion-icon name="send-outline"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-card-content>
    </ion-card>
  </div>


</ion-content>
